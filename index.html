<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capital Quiz</title>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TBBELPHMHP"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      // The automatic page view is suppressed because it fires before main.js can
      // profile the player, so it would carry no player fields. trackPlayer sends it
      // instead, once the profile is known (sendPageView: true). Set both or neither.
      gtag('config', 'G-TBBELPHMHP', { send_page_view: false })
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A full-screen capital-city quiz for digital signage — one country per load: name the capital, then see it revealed with its city and country population."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b1d2a' stroke='%23d8a657' stroke-width='2'/%3E%3Cpath d='M3 16h26 M16 3v26 M16 3c7 6 7 20 0 26 M16 3c-7 6-7 20 0 26' fill='none' stroke='%23d8a657' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      href="/static/fonts/fraunces-latin-standard-normal.woff2?v=__ASSET_VERSION__"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/static/fonts/hanken-grotesk-latin-wght-normal.woff2?v=__ASSET_VERSION__"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/static/styles/main.css?v=__ASSET_VERSION__" />
    <script src="/static/js/main.js?v=__ASSET_VERSION__" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="quiz" aria-live="polite">
        <h1 class="quiz__question">
          <span class="quiz__prompt">What is the capital of</span>
          <span class="quiz__country" id="country-name">France</span>
          <span class="quiz__qmark" aria-hidden="true">?</span>
        </h1>

        <span class="quiz__rule" aria-hidden="true"></span>

        <div class="reveal">
          <div class="reveal__inner">
            <p class="reveal__label">Capital</p>
            <h2 class="reveal__capital" id="capital-name">Paris</h2>
            <dl class="reveal__stats">
              <div class="stat">
                <dt class="stat__label">City population</dt>
                <dd class="stat__value" id="capital-pop">2.1 million (2,102,650)</dd>
                <dd class="stat__meta" id="capital-pop-meta">2021 · Census, INSEE</dd>
              </div>
              <div class="stat">
                <dt class="stat__label">Country population</dt>
                <dd class="stat__value" id="country-pop">67.4 million (67,394,000)</dd>
                <dd class="stat__meta" id="country-pop-meta">2020 · Census, INSEE</dd>
              </div>
            </dl>
            <p class="reveal__note" id="reveal-note"></p>
          </div>
        </div>
      </section>

      <a
        class="brand"
        href="https://www.screenly.io"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Screenly — opens in a new tab"
      >
        <img src="/static/images/screenly-logo.svg?v=__ASSET_VERSION__" alt="Screenly" />
      </a>
    </main>
  </body>
</html>
